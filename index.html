<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <meta name="design_doc_mode" content="canvas">
  <style>
    body { margin: 0; background: #0D0A08; font-family: NeueHaasGroteskDisplay, "Neue Haas Grotesk Display", NeueHaasGrotesk, "Neue Haas Grotesk", HelveticaNeue, "Helvetica Neue", Helvetica, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
    a { color: #D8A96F; } a:hover { color: #E5BE8C; }
  </style>
</helmet>
<div style="min-height: 100vh; padding: 36px 44px 60px; box-sizing: border-box; background-color: #0D0A08; background-image: radial-gradient(120% 100% at 78% -12%, rgba(176,116,54,0.55) 0%, rgba(120,74,32,0.20) 38%, rgba(13,10,8,0) 70%); background-repeat: no-repeat; background-size: 100% 300px;">
  <div style="display: flex; align-items: baseline; gap: 14px; margin-bottom: 6px;">
    <img src="app/assets/pga-full-dark.png" alt="PG Alpha" style="height: 26px; position: relative; top: 4px;">
    <span style="font-size: 13px; font-weight: 600; color: #F6EFE4;">2.0 prototype<br><br></span>
  </div>
  

  <div style="display: flex; align-items: center; gap: 18px; flex-wrap: wrap; margin-bottom: 22px;">
    <div role="group" aria-label="Viewport" style="display: flex; gap: 4px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.10); border-radius: 999px; padding: 4px;">
      <button type="button" onClick="{{ pickMobile }}" aria-pressed="{{ isMobile }}" style="border: 0; cursor: pointer; font: inherit; font-size: 12px; font-weight: 600; letter-spacing: 0.01em; padding: 8px 16px; border-radius: 7px; background: {{ mobileBg }}; color: {{ mobileFg }};" style-hover="background: rgba(255,255,255,0.06); color: #F6EFE4;">Mobile</button>
      <button type="button" onClick="{{ pickTablet }}" aria-pressed="{{ isTablet }}" style="border: 0; cursor: pointer; font: inherit; font-size: 12px; font-weight: 600; letter-spacing: 0.01em; padding: 8px 16px; border-radius: 7px; background: {{ tabletBg }}; color: {{ tabletFg }};" style-hover="background: rgba(255,255,255,0.06); color: #F6EFE4;">Tablet</button>
      <button type="button" onClick="{{ pickDesktop }}" aria-pressed="{{ isDesktop }}" style="border: 0; cursor: pointer; font: inherit; font-size: 12px; font-weight: 600; letter-spacing: 0.01em; padding: 8px 16px; border-radius: 7px; background: {{ desktopBg }}; color: {{ desktopFg }};" style-hover="background: rgba(255,255,255,0.06); color: #F6EFE4;">Desktop</button>
    </div>

    <button type="button" onClick="{{ toggleTheme }}" aria-pressed="{{ isDark }}" style="display: inline-flex; align-items: center; gap: 8px; border: 1px solid rgba(255,255,255,0.14); background: rgba(255,255,255,0.05); color: #F6EFE4; cursor: pointer; font: inherit; font-size: 12px; font-weight: 600; padding: 9px 15px; border-radius: 999px;" style-hover="background: rgba(255,255,255,0.10);">
      <span aria-hidden="true" style="font-size: 13px;">◐</span>{{ themeLabel }}
    </button>

    <span style="font-size: 11px; color: #9A8A76; letter-spacing: 0.04em; text-transform: uppercase;">{{ frameLabel }}</span>
  </div>

  <sc-if value="{{ isMobile }}" hint-placeholder-val="{{ true }}">
    <div style="width: 390px; height: 844px; background: #0D0A08; border-radius: 34px; border: 10px solid #221C17; box-shadow: 0 0 0 1px rgba(255,255,255,0.14), 0 18px 48px rgba(0,0,0,0.6); overflow: hidden;">
      <iframe src="app/frame.html" title="PG Alpha — mobile" style="width: 390px; height: 844px; border: 0; display: block; border-radius: 24px;"></iframe>
    </div>
  </sc-if>
  <sc-if value="{{ isTablet }}" hint-placeholder-val="{{ false }}">
    <div style="width: 1112px; height: 834px; background: #0D0A08; border-radius: 26px; border: 12px solid #221C17; box-shadow: 0 0 0 1px rgba(255,255,255,0.14), 0 18px 48px rgba(0,0,0,0.6); overflow: hidden;">
      <iframe src="app/frame.html" title="PG Alpha — tablet, landscape" style="width: 1112px; height: 834px; border: 0; display: block; border-radius: 14px;"></iframe>
    </div>
  </sc-if>
  <sc-if value="{{ isDesktop }}" hint-placeholder-val="{{ false }}">
    <div style="width: 1440px; height: 900px; background: #0D0A08; border-radius: 14px; border: 1px solid rgba(255,255,255,0.16); box-shadow: 0 18px 48px rgba(0,0,0,0.5); overflow: hidden;">
      <iframe src="app/frame.html" title="PG Alpha — desktop" style="width: 1440px; height: 900px; border: 0; display: block;"></iframe>
    </div>
  </sc-if>

  
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;resetDemoData&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: false, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Demo&quot;, &quot;description&quot;: &quot;Tick to clear saved demo edits (personalisation, added KPIs, folder moves) on next load.&quot;}}">
class Component extends DCLogic {
  /* The app frame reads localStorage 'pgalpha-theme' before its stylesheets
   * paint, so the theme has to be written at construction — before the iframe
   * in the first streamed markup starts loading — or the frame flashes light. */
  state = { device: 'mobile', theme: (() => {
    var t = null;
    try { t = localStorage.getItem('pgalpha-theme'); } catch (e) { /* private mode */ }
    if (t !== 'dark' && t !== 'light') { t = 'dark'; try { localStorage.setItem('pgalpha-theme', t); } catch (e) {} }
    return t;
  })() };

  reloadFrames() {
    // Frames are same-origin; re-assigning src re-runs their pre-paint theme read.
    document.querySelectorAll('iframe[title^="PG Alpha"]').forEach((f) => { f.src = f.src; });
  }

  setDevice(device) { this.setState({ device }); }

  toggleTheme() {
    const theme = this.state.theme === 'dark' ? 'light' : 'dark';
    try { localStorage.setItem('pgalpha-theme', theme); } catch (e) {}
    this.setState({ theme }, () => this.reloadFrames());
  }

  clearDemoData() {
    try {
      Object.keys(localStorage)
        .filter((k) => k.startsWith('pgalpha') && k !== 'pgalpha-theme')
        .forEach((k) => localStorage.removeItem(k));
    } catch (e) { /* noop */ }
  }

  componentDidMount() {
    if (this.props.resetDemoData) { this.clearDemoData(); this.reloadFrames(); }
  }

  renderVals() {
    const d = this.state.device;
    const dark = this.state.theme === 'dark';
    return {
      isMobile: d === 'mobile',
      isTablet: d === 'tablet',
      isDesktop: d === 'desktop',
      isDark: dark,
      themeLabel: dark ? 'Dark mode' : 'Light mode',
      frameLabel: d === 'mobile' ? 'iPhone · 390 × 844'
        : d === 'tablet' ? 'iPad landscape · 1112 × 834'
        : 'Desktop · 1440 × 900',
      mobileBg: d === 'mobile' ? '#D8A96F' : 'transparent',
      mobileFg: d === 'mobile' ? '#241B13' : '#C9BAA6',
      tabletBg: d === 'tablet' ? '#D8A96F' : 'transparent',
      tabletFg: d === 'tablet' ? '#241B13' : '#C9BAA6',
      desktopBg: d === 'desktop' ? '#D8A96F' : 'transparent',
      desktopFg: d === 'desktop' ? '#241B13' : '#C9BAA6',
      pickMobile: () => this.setDevice('mobile'),
      pickTablet: () => this.setDevice('tablet'),
      pickDesktop: () => this.setDevice('desktop'),
      toggleTheme: () => this.toggleTheme(),
      resetDemo: () => { this.clearDemoData(); this.reloadFrames(); },
    };
  }
}
</script>
</body>
</html>
